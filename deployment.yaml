
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-project
spec:
  replicas: 2

  selector:
    matchLabels:
      app: mini-project

  template:
    metadata:
      labels:
        app: mini-project

    spec:
      containers:
        - name: mini-project
          image: 722632731549.dkr.ecr.ap-south-1.amazonaws.com/project_ecr/mini_project:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service

metadata:
  name: mini-project-service
spec:
  selector:
    app: mini-project

  ports:
      -port: 80
      targetPort: 80
      protocol: TCP
      type: LoadBalancer

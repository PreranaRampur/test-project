
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-project
spec:
  replicas: 2

  selector:
    matchLabels:
      app: mini-project

  template:
    metadata:
      labels:
        app: mini-project

    spec:
      imagePullSecrets:
        - name: ecr-secret

      containers:
        - name: mini-project
          image: 722632731549.dkr.ecr.ap-south-1.amazonaws.com/project_ecr/mini_project:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80
              name: http

---
apiVersion: v1
kind: Service

metadata:
  name: mini-project-service

spec:
  type: ClusterIP

  selector:
    app: mini-project

  ports:
      port: 80
      targetPort: 80
